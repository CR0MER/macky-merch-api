services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: macky_merch_dev
      MYSQL_USER: macky
      MYSQL_PASSWORD: mackypassword
    ports:
      - '3307:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-prootpassword']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - '3100:3100'
    environment:
      PORT: 3100
      DATABASE_URL: mysql://macky:mackypassword@db:3306/macky_merch_dev
    depends_on:
      db:
        condition: service_healthy
